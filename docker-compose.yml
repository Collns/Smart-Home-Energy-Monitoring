services:
  mosquitto:                      # Part 1
    image: eclipse-mosquitto:2.0.20
    container_name: mosquitto
    ports:
      - "1883:1883"               # dev only – remove once TLS works
      - "8883:8883"               # TLS
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data   # message persistence
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

  simulator:                      # Part 1
    build: ./simulator
    env_file: .env
    volumes:
      - ./mosquitto/certs:/certs:ro
      - ./data:/data              # ground-truth fault log for ML evaluation
    depends_on: [mosquitto]
    restart: unless-stopped

  processor:                      # Part 2
    build: ./processor
    env_file: .env
    volumes:
      - ./mosquitto/certs:/certs:ro
      - ./data:/data              # local buffer when Azure is unreachable
      - ./processor/anomaly/models:/app/anomaly/models
    depends_on: [mosquitto]
    restart: unless-stopped

  grafana:                        # Part 3
    image: grafana/grafana:11.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-azure-data-explorer-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  mosquitto-data:
  mosquitto-log:
  grafana-data:
